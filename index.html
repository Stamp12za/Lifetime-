<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>MY LIFE — Life Simulator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap');
:root{--bg:#080b16;--panel:#11172a;--panel2:#171e34;--line:#29324d;--text:#f7f8ff;--muted:#8e99b7;--a:#8b7cff;--good:#45d483;--bad:#ff647c;--gold:#ffc857;--cyan:#4ed7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#25264f 0,#080b16 38%,#060811 100%);color:var(--text);font-family:Prompt,Kanit,system-ui,sans-serif}button{font:inherit}
.app{max-width:1220px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{font:800 28px Kanit}.brand span{color:var(--a)}.top-actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:#12182a;color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}
.layout{display:grid;grid-template-columns:275px 1fr;gap:15px}.panel{background:linear-gradient(180deg,#12182b,#0f1425);border:1px solid var(--line);border-radius:21px;box-shadow:0 18px 50px #0005}.profile{padding:16px;height:max-content;position:sticky;top:12px}.avatar{width:100%;aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#292650,#151c34);display:flex;align-items:center;justify-content:center;font-size:108px;border:1px solid #3b4260}.pname{font-size:22px;font-weight:800;margin-top:12px}.job{color:#a99fff;font-weight:700}.muted{color:var(--muted);font-size:12px}.bar{height:7px;background:#252c43;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--cyan));border-radius:99px}.badbox{margin-top:12px;padding:10px;border:1px solid #4a2940;background:#1d1421;color:#ff9bae;border-radius:12px;font-size:12px}.main{display:flex;flex-direction:column;gap:15px}.status{padding:16px}.date{display:flex;justify-content:space-between;align-items:end}.date h1{font-size:24px;margin:0}.age{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:13px}.stat{background:#0d1322;border:1px solid #232c45;border-radius:14px;padding:11px}.stat small{color:var(--muted)}.num{font-size:20px;font-weight:800;margin-top:3px}.money .num{color:var(--gold)}.event{padding:20px}.rarity{display:inline-block;padding:4px 9px;border-radius:99px;background:#27223d;color:#c5bfff;border:1px solid #453d70;font-size:11px;font-weight:800}.rarity.uncommon{color:#64e6b3}.rarity.rare{color:#62d8ff}.rarity.legendary{color:#ffd166}.rarity.mystery{color:#ff75dd}.event h2{font-size:28px;margin:12px 0 6px}.desc{line-height:1.75;color:#c4cbdf}.effects{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.effect{background:#0b1120;border:1px solid #252f49;border-radius:10px;padding:7px 10px;font-size:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{background:#202942;color:#fff;border:1px solid #343d5b;border-radius:13px;padding:13px;text-align:left;cursor:pointer}.choice:hover{border-color:var(--a);transform:translateY(-1px)}.choice b{display:block}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.history{padding:15px}.history h3{margin:0 0 8px}.log{max-height:230px;overflow:auto}.logrow{display:flex;gap:9px;border-bottom:1px solid #20283f;padding:8px 2px;font-size:12px}.dot{width:7px;height:7px;background:var(--a);border-radius:50%;margin-top:6px;flex:none}
.overlay{position:fixed;inset:0;background:#02040dcc;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#12182a;border:1px solid #36405d;border-radius:22px;padding:20px}.modal h2{margin-top:0}.modalgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.modalcard{background:#0d1322;border:1px solid #242e47;border-radius:12px;padding:12px}.modalcard b{font-size:18px}.close{margin-top:12px;width:100%;padding:11px;border:0;border-radius:11px;background:var(--a);color:white;cursor:pointer}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,25px);opacity:0;background:#f0f1ff;color:#090c18;padding:10px 14px;border-radius:12px;font-weight:700;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.profile{position:relative;display:grid;grid-template-columns:95px 1fr;gap:12px}.avatar{grid-row:span 3;font-size:58px}.pname{margin:0}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:span 2}}@media(max-width:520px){.app{padding:9px}.choices{grid-template-columns:1fr}.event h2{font-size:23px}.top .iconbtn:nth-child(2){display:none}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">MY <span>LIFE</span></div><div class="top-actions"><button class="iconbtn" onclick="stats()">📊 สถิติ</button><button class="iconbtn" onclick="newLife()">🔄 ชีวิตใหม่</button></div></div>
<div class="layout">
<aside class="panel profile">
<div class="avatar" id="avatar">🧑🏻</div>
<div><div class="pname" id="name">นนท์</div><div class="job" id="job">นักศึกษา</div><div class="muted" id="bio">อายุ 18 ปี • จุดเริ่มต้นของชีวิต</div></div>
<div style="grid-column:1/-1"><div class="muted" style="margin:7px 0 5px">❤️ พลังชีวิต</div><div class="bar"><i id="hbar"></i></div><div id="debt"></div><div class="muted" style="margin-top:11px">เป้าหมาย: สร้างชีวิตที่คุณภูมิใจ</div></div>
</aside>
<main class="main">
<section class="panel status"><div class="date"><div><h1 id="date"></h1><div class="age" id="age"></div></div><div class="muted">1 เทิร์น = 1 เดือน</div></div><div class="stats" id="stats"></div></section>
<section class="panel event"><div id="rarity" class="rarity">COMMON</div><h2 id="title"></h2><div class="desc" id="desc"></div><div class="effects" id="effects"></div><div class="choices" id="choices"></div></section>
<section class="panel history"><h3>📜 บันทึกชีวิต</h3><div class="log" id="log"></div></section>
</main></div></div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">📊 สถิติชีวิต</h2><div id="modalBody"></div><button class="close" onclick="closeModal()">ปิด</button></div></div><div class="toast" id="toast"></div>

<script>
const initial={year:1,month:1,age:18,money:12500,health:87,happy:72,knowledge:54,job:"นักศึกษา",salary:0,debt:0,partner:false,house:false,business:false,invest:0,pandemic:false,recession:false,unemployed:false,months:0,events:0,choices:0,good:0,bad:0,name:"นนท์",avatar:"🧑🏻"};
let G={...initial},current=null;
const $=x=>document.getElementById(x),clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n)),fmt=n=>new Intl.NumberFormat("th-TH").format(Math.round(n));
function render(){ $("date").textContent=`ปีที่ ${G.year} — เดือนที่ ${G.month}`;$("age").textContent=`อายุ ${G.age} ปี`;$("name").textContent=G.name;$("job").textContent=G.job;$("avatar").textContent=G.avatar;$("hbar").style.width=clamp(G.health)+"%";$("bio").textContent=`อายุ ${G.age} ปี • ${G.partner?"❤️ มีความรัก • ":""}${G.house?"🏠 มีบ้าน • ":""}${G.business?"🏢 มีธุรกิจ":"กำลังสร้างอนาคต"}`;$("debt").innerHTML=G.debt>0?`<div class="badbox">💳 หนี้สิน ${fmt(G.debt)} บาท</div>`:"";
const a=[["💰","เงิน",fmt(G.money)],["❤️","สุขภาพ",Math.round(G.health)+"%"],["😊","ความสุข",Math.round(G.happy)+"%"],["🧠","ความรู้",Math.round(G.knowledge)+"%"],["💵","รายได้/เดือน",fmt(G.salary)]];
$("stats").innerHTML=a.map((x,i)=>`<div class="stat ${i===0?"money":""}"><small>${x[0]} ${x[1]}</small><div class="num">${x[2]}</div>${i>0&&i<4?`<div class="bar" style="margin-top:6px"><i style="width:${clamp(parseFloat(x[2]))}%"></i></div>`:""}</div>`).join("")}
function log(t){$("log").insertAdjacentHTML("afterbegin",`<div class="logrow"><i class="dot"></i><div>${t}</div></div>`)}
const E=[
["Common",60,"☕ เดือนธรรมดา","ชีวิตไม่ได้มีอะไรหวือหวา แต่การเลือกเล็ก ๆ จะสะสมเป็นอนาคต",[
["📚 ตั้งใจเรียน","ความรู้ +3 / ความสุข -1",()=>{G.knowledge+=3;G.happy-=1}],["🛋️ พักผ่อน","สุขภาพ +3 / ความสุข +3",()=>{G.health+=3;G.happy+=3}]]],
["Common",60,"🛍️ ของที่อยากได้","ของที่เล็งไว้นานกำลังลดราคา คุณจะใช้เงินหรือเก็บไว้?",[
["ซื้อเลย","เงิน -2,000 / ความสุข +7",()=>{G.money-=2000;G.happy+=7}],["เก็บเงิน","ความรู้ +1",()=>G.knowledge+=1]]],
["Common",60,"👨‍👩‍👦 มื้ออาหารกับครอบครัว","มื้อธรรมดา ๆ กลับทำให้คุณรู้สึกอบอุ่นกว่าที่คิด",[
["ไปกินด้วยกัน","ความสุข +6",()=>G.happy+=6],["ทำงานก่อน","เงิน +2,000 / ความสุข -2",()=>{G.money+=2000;G.happy-=2}]]],
["Uncommon",25,"💼 ได้งานพิเศษ","งานพิเศษรายได้ดี แต่ต้องแลกกับเวลาพักผ่อน",[
["รับงาน","เงิน +8,000 / สุขภาพ -4",()=>{G.money+=8000;G.health-=4}],["ปฏิเสธ","ความสุข +2",()=>G.happy+=2]]],
["Uncommon",25,"❤️ พบคนถูกใจ","คุณพบใครบางคนที่คุยด้วยแล้วเวลาผ่านไปเร็วมาก",[
["ลองเปิดใจ","มีแฟน / ความสุข +12",()=>{G.partner=true;G.happy+=12}],["ยังไม่พร้อม","ความรู้ +2",()=>G.knowledge+=2]]],
["Uncommon",25,"🎓 โอกาสเรียนต่อ","คุณได้รับโอกาสเข้าเรียนหลักสูตรที่ดีขึ้น",[
["คว้าโอกาส","ความรู้ +12 / เงิน -5,000",()=>{G.knowledge+=12;G.money-=5000}],["ทำงานต่อ","เงิน +10,000",()=>G.money+=10000]]],
["Rare",10,"📈 ลงทุนแล้วหุ้นพุ่ง","สินทรัพย์ของคุณโตแรงกว่าคาด จะล็อกกำไรหรือเสี่ยงต่อ?",[
["ขายทำกำไร","เงิน +80,000",()=>G.money+=80000],["ถือต่อ","เงิน +20,000 / ความเสี่ยงเพิ่ม",()=>{G.money+=20000;G.invest++}]]],
["Rare",10,"🚀 ธุรกิจเริ่มดัง","งานเล็ก ๆ หลังเลิกเรียน/งานเริ่มมีลูกค้าจำนวนมาก",[
["ลุยเต็มตัว","เจ้าของกิจการ / เงิน +60,000",()=>{G.business=true;G.job="เจ้าของกิจการ";G.salary=40000;G.money+=60000;G.knowledge+=6}],["ทำเป็นงานเสริม","เงิน +30,000 / ความรู้ +3",()=>{G.money+=30000;G.knowledge+=3}]]],
["Rare",10,"🚗 อุบัติเหตุ","เหตุการณ์ไม่คาดคิดทำให้ต้องหยุดพักและเสียค่าใช้จ่าย",[
["รักษาตัว","เงิน -25,000 / สุขภาพ -12",()=>{G.money-=25000;G.health-=12}],["ฝืนทำงาน","เงิน -10,000 / สุขภาพ -25",()=>{G.money-=10000;G.health-=25}]]],
["Rare",10,"🏠 ครอบครัวมอบบ้าน","คุณได้รับบ้านจากครอบครัว ภาระค่าเช่าจึงหายไป",[
["รับบ้าน","ได้บ้าน / ความสุข +12",()=>{G.house=true;G.happy+=12}],["ขายบ้าน","เงิน +1,200,000",()=>G.money+=1200000]]],
["Legendary",4,"🎉 ถูกรางวัลที่ 1!","สลากที่คุณซื้อไว้ถูกรางวัลที่ 1 ชีวิตกำลังเปลี่ยนไปตลอดกาล",[
["รับเงินรางวัล","เงิน +6,000,000 / ความสุข +20",()=>{G.money+=6000000;G.happy+=20}]]],
["Legendary",4,"🍀 ได้รับมรดก","ญาติห่าง ๆ ทิ้งทรัพย์สินจำนวนมหาศาลไว้ให้",[
["รับมรดก","เงิน +20,000,000 / ความสุข +25",()=>{G.money+=20000000;G.happy+=25}]]],
["Legendary",4,"💔 ความสัมพันธ์พัง","ความสัมพันธ์ที่คิดว่าจะไปต่อกลับมาถึงจุดแตกหัก",[
["เริ่มใหม่","เลิกกับแฟน / ความสุข -18 / ความรู้ +4",()=>{G.partner=false;G.happy-=18;G.knowledge+=4}],["พยายามแก้ไข","ความสุข -8 / สุขภาพ -4",()=>{G.happy-=8;G.health-=4}]]],
["???",1,"🌌 โอกาสที่ไม่มีใครอธิบายได้","คุณพบโอกาสครั้งเดียวในชีวิต อาจเป็นจุดเปลี่ยนครั้งใหญ่ที่สุด",[
["คว้าโอกาส","เงิน +50,000,000 / ความสุข +40",()=>{G.money+=50000000;G.happy+=40}],["เดินผ่านไป","ความรู้ +20",()=>G.knowledge+=20]]]
];
function special(){
if(G.recession&&G.unemployed&&G.money<7000)return["Uncommon",0,"🎲 เงินเริ่มหมด","หลังตกงาน เงินสำรองกำลังหายไป คุณต้องเลือกทางรอด",[
["กู้เงิน","เงิน +50,000 / หนี้ +60,000",()=>{G.money+=50000;G.debt+=60000}],["หางานใหม่","เงินเดือน 25,000 / ความสุข +6",()=>{G.job="พนักงานบริษัท";G.salary=25000;G.unemployed=false;G.happy+=6}],["เริ่มธุรกิจ","เจ้าของกิจการ / เงิน -5,000",()=>{G.money-=5000;G.job="เจ้าของกิจการ";G.salary=35000;G.business=true;G.unemployed=false;G.knowledge+=8}]]];
if(G.recession&&!G.unemployed)return["Uncommon",0,"🏢 บริษัทเริ่มปลดพนักงาน","เศรษฐกิจตกต่ำทำให้บริษัทลดคน งานของคุณกำลังสั่นคลอน",[
["ยอมลดเงินเดือน","เงินเดือน -20%",()=>G.salary=Math.round(G.salary*.8)],["ลาออกก่อน","กลายเป็นคนว่างงาน / ความสุข -8",()=>{G.job="ว่างงาน";G.salary=0;G.unemployed=true;G.happy-=8}]]];
return null}
function pick(){
let s=special();if(s)return s;
if(!G.pandemic&&Math.random()<.025)return["Legendary",0,"🦠 เกิดการแพร่ระบาดครั้งใหญ่","รัฐประกาศมาตรการควบคุมโรค มหาวิทยาลัยปิดชั่วคราวและเศรษฐกิจชะลอตัว",[
["อยู่บ้านดูแลตัวเอง","สุขภาพ -5 / ความสุข -8",()=>{G.health-=5;G.happy-=8;G.pandemic=true}],["ทำงานออนไลน์","เงิน +5,000 / สุขภาพ -8",()=>{G.money+=5000;G.health-=8;G.pandemic=true}]]];
if(!G.recession&&Math.random()<.018&&G.year<8)return["Rare",0,"📉 เศรษฐกิจเริ่มตกต่ำ","ตลาดเริ่มชะลอตัว บริษัทจำนวนมากส่งสัญญาณลดต้นทุน นี่อาจเป็นจุดเริ่มต้นของ Chain",[
["เก็บเงินสด","เข้าสู่ภาวะเศรษฐกิจตกต่ำ",()=>{G.recession=true}],["ลงทุนสวนตลาด","เงิน -20,000 / เข้าสู่ภาวะเสี่ยง",()=>{G.recession=true;G.money-=20000;G.invest+=2}]]];
let total=E.reduce((a,e)=>a+e[1],0),r=Math.random()*total;for(const e of E){r-=e[1];if(r<=0)return e}return E[0]}
function show(){current=pick();render();$("rarity").className="rarity "+current[0].toLowerCase().replace("???","mystery");$("rarity").textContent=current[0].toUpperCase();$("title").textContent=current[2];$("desc").textContent=current[3];$("effects").innerHTML=current[4].map(c=>`<div class="effect">${c[1]}</div>`).join("");$("choices").innerHTML=current[4].map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c[0]}</b><span>${c[1]}</span></button>`).join("")}
function choose(i){current[4][i][2]();G.events++;G.choices++;if(G.money<0){G.debt+=Math.abs(G.money);G.money=0;G.happy-=6;log("💸 เงินไม่พอ — ยอดที่ติดลบถูกเปลี่ยนเป็นหนี้")};log(`${current[2]} → <b>${current[4][i][0]}</b>`);next()}
function next(){
if(G.job==="นักศึกษา"){G.money+=3000;G.knowledge+=1}else if(G.salary>0)G.money+=G.salary;
if(G.business)G.money+=10000+Math.floor(Math.random()*35000);
if(!G.house)G.money-=3000;
if(G.partner)G.happy+=.4;
if(G.debt>0){let p=Math.min(G.money,Math.max(500,Math.round(G.debt*.025)));G.money-=p;G.debt-=p}
G.health-=.15;G.happy-=.08;G.months++;
if(G.months%12===0){G.age++;G.year++}
G.health=clamp(G.health);G.happy=clamp(G.happy);G.knowledge=clamp(G.knowledge);
if(G.health<=0||G.age>=80){end();return}show()}
function stats(){$("modalTitle").textContent="📊 สถิติชีวิต";$("modalBody").innerHTML=`<div class="modalgrid">
<div class="modalcard">💰 ทรัพย์สิน<br><b>${fmt(G.money)}</b> บาท</div><div class="modalcard">💳 หนี้<br><b>${fmt(G.debt)}</b> บาท</div>
<div class="modalcard">❤️ สุขภาพ<br><b>${Math.round(G.health)}%</b></div><div class="modalcard">😊 ความสุข<br><b>${Math.round(G.happy)}%</b></div>
<div class="modalcard">🧠 ความรู้<br><b>${Math.round(G.knowledge)}%</b></div><div class="modalcard">📅 อายุ<br><b>${G.age}</b> ปี</div>
<div class="modalcard">📆 ผ่านมา<br><b>${G.months}</b> เดือน</div><div class="modalcard">🎲 เหตุการณ์<br><b>${G.events}</b> ครั้ง</div>
<div class="modalcard">❤️ ความสัมพันธ์<br><b>${G.partner?"มีคู่":"โสด"}</b></div><div class="modalcard">🏠 บ้าน<br><b>${G.house?"มี":"ไม่มี"}</b></div>
